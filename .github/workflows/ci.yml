name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      consumer_diagnostic:
        description: Run only the cold x64 Bun public-package diagnostic
        type: boolean
        default: false
      consumer_version:
        description: Exact published proc-safe version to diagnose
        type: string
        default: '0.8.0'
      consumer_probe:
        description: Package smoke or import-free runtime startup
        type: choice
        default: package
        options: [package, startup]
      startup_launch:
        description: Direct Bun launch or explicit x64 arch launcher
        type: choice
        default: direct
        options: [direct, arch]
      startup_observe:
        description: Observe one owned direct-startup child with a bounded stack sample
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint-workflows:
    if: ${{ !inputs.consumer_diagnostic }}
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
  typescript:
    if: ${{ !inputs.consumer_diagnostic }}
    name: TypeScript checks (Node ${{ matrix.node-major }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.22.1"]
        include:
          - node: "22.23.4"
            node-major: 22
          - node: "24.22.1"
            node-major: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  cargo-quality:
    if: ${{ !inputs.consumer_diagnostic }}
    name: Cargo clippy and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
  native:
    if: ${{ !inputs.consumer_diagnostic }}
    uses: ./.github/workflows/native.yml
  consumer-diagnostic:
    name: Cold published consumer (macOS x64)
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_diagnostic
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare Rosetta for x64 consumers
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          architecture: x64
      - name: Install x64 Bun without warming it
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --retry-max-time 300 --connect-timeout 15 --max-time 120 "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-darwin-x64.zip" -o "$RUNNER_TEMP/bun-x64.zip"
          unzip -q "$RUNNER_TEMP/bun-x64.zip" -d "$RUNNER_TEMP/bun-x64"
          echo "$RUNNER_TEMP/bun-x64/bun-darwin-x64" >> "$GITHUB_PATH"
      - name: Verify Node architecture and identify the cold Bun executable
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { accessSync, constants, readFileSync, realpathSync } from 'node:fs';
          import { delimiter, join } from 'node:path';
          assert.equal(process.arch, 'x64');
          const binary = process.env.PATH.split(delimiter).map(dir => join(dir, 'bun')).find(path => {
            try { accessSync(path, constants.X_OK); return true; } catch { return false; }
          });
          assert.ok(binary, 'Bun executable must resolve on PATH');
          const expected = realpathSync(join(process.env.RUNNER_TEMP, 'bun-x64/bun-darwin-x64/bun'));
          assert.equal(realpathSync(binary), expected, 'expected pinned Bun executable');
          const sha256 = createHash('sha256').update(readFileSync(binary)).digest('hex');
          assert.equal(sha256, 'c35307c7d45d65c5a385a58c4a6cb0bb9499e4e626abdee207c177a77ba666ab', 'same Bun 1.4.4 bytes as the package diagnostic');
          console.log(JSON.stringify({ executable: 'bun-darwin-x64', sha256 }));
          NODE
      - name: Check cold Bun startup without package imports
        if: inputs.consumer_probe == 'startup'
        shell: bash
        env:
          STARTUP_LAUNCH: ${{ inputs.startup_launch }}
          STARTUP_OBSERVE: ${{ inputs.startup_observe }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdtempSync, rmSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const directory = mkdtempSync(join(tmpdir(), 'proc-safe-startup-'));
          const env = { ...process.env };
          for (const key of Object.keys(env)) {
            if (/^npm_config_/i.test(key) || ['NODE_PATH', 'NODE_OPTIONS', 'PROC_SAFE_NATIVE', 'NPM_TOKEN', 'NODE_AUTH_TOKEN'].includes(key)) delete env[key];
          }
          env.npm_config_userconfig = join(directory, 'empty-npmrc');
          env.npm_config_globalconfig = join(directory, 'empty-global-npmrc');
          env.npm_config_cache = join(directory, 'cache');
          try {
            writeFileSync(env.npm_config_userconfig, '');
            writeFileSync(env.npm_config_globalconfig, '');
            writeFileSync(join(directory, 'package.json'), JSON.stringify({ private: true, type: 'module' }));
            const args = ['--eval', `
              console.log(JSON.stringify({ phase: 'startup-entry', runtime: process.versions.bun, arch: process.arch }));
              if (process.versions.bun !== '1.4.4' || process.arch !== 'x64') throw new Error('unexpected Bun runtime');
            `];
            const withArch = process.env.STARTUP_LAUNCH === 'arch';
            delete env.STARTUP_LAUNCH;
            delete env.STARTUP_OBSERVE;
            if (process.env.STARTUP_OBSERVE === 'true') {
              if (withArch) throw new Error('observation requires direct startup');
              const { observeStartup, sampleStartup } = await import('./scripts/startup-observation.mjs');
              const result = await observeStartup('bun', args, {
                cwd: directory, env, sample: pid => sampleStartup(pid, directory),
              });
              console.log(JSON.stringify({ diagnostic: 'startup-observation', ...result }));
              if (result.timedOut || result.code !== 0) throw new Error('observed startup failed');
            } else {
              execFileSync(withArch ? '/usr/bin/arch' : 'bun', withArch ? ['-x86_64', 'bun', ...args] : args,
                { cwd: directory, env, stdio: 'inherit', timeout: 30000 });
            }
          } finally { rmSync(directory, { recursive: true, force: true }); }
          NODE
      - name: Trace fresh public-registry install and default calls
        if: inputs.consumer_probe != 'startup'
        env:
          PROC_SAFE_SMOKE_TRACE: '1'
          CONSUMER_VERSION: ${{ inputs.consumer_version }}
        run: node scripts/installed-smoke.mjs "$CONSUMER_VERSION" --bun
