name: Native runtimes
on:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    name: Native (${{ matrix.label }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        label: [linux-x64-gnu, linux-arm64-gnu, darwin-x64, darwin-arm64, win32-x64-msvc, win32-arm64-msvc]
        include:
          - label: linux-x64-gnu
            os: ubuntu-latest
            arch: x64
          - label: linux-arm64-gnu
            os: ubuntu-24.04-arm
            arch: arm64
          - label: darwin-x64
            os: macos-15-intel
            arch: x64
          - label: darwin-arm64
            os: macos-15
            arch: arm64
          - label: win32-x64-msvc
            os: windows-latest
            arch: x64
          - label: win32-arm64-msvc
            os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}
      - name: Verify real runner architecture
        run: node -e "if(process.arch !== '${{ matrix.arch }}') throw new Error('wrong runner architecture')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm native:build
      - name: Native Node contracts and main/Worker proof
        env:
          PROC_SAFE_NATIVE: require
        run: pnpm test
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Native Bun contracts and main/Worker proof
        env:
          PROC_SAFE_NATIVE: require
        run: pnpm test:bun
      - name: Real Windows permission denial
        if: runner.os == 'Windows'
        run: node scripts/check-windows-denial.mjs
      - name: Real Darwin permission denial
        if: runner.os == 'macOS'
        run: node scripts/check-darwin-denial.mjs
      - name: Real restricted procfs namespace
        if: runner.os == 'Linux'
        run: node scripts/check-restricted-visibility.mjs
      - name: Real foreign-file residency denial
        if: runner.os == 'Linux'
        run: node scripts/check-residency-denial.mjs
      - run: pnpm package:smoke
      - run: pnpm benchmark:imports
      - run: bun scripts/benchmark-imports.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.node == 24
        with:
          name: binding-${{ matrix.label }}
          path: native/*.node
          if-no-files-found: error
  musl:
    name: Native (${{ matrix.label }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        label: [linux-x64-musl, linux-arm64-musl]
        include:
          - label: linux-x64-musl
            os: ubuntu-latest
            arch: x64
          - label: linux-arm64-musl
            os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and execute on musl
        env:
          NODE_MAJOR: ${{ matrix.node }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -e EXPECTED_ARCH -v "$PWD:/work" -w /work "node:${NODE_MAJOR}-alpine" sh -euxc '
            apk add --no-cache build-base curl unzip bash
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
            npm install --global pnpm@12.10.1
            node -e "if(process.arch !== process.env.EXPECTED_ARCH) throw new Error(\"wrong runner\")"
            pnpm install --frozen-lockfile
            pnpm build
            pnpm native:build
            PROC_SAFE_NATIVE=require pnpm test
            node scripts/check-residency-denial.mjs
            pnpm package:smoke
            bun_arch="$EXPECTED_ARCH"
            if [ "$bun_arch" = arm64 ]; then bun_arch=aarch64; fi
            curl -fL "https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-${bun_arch}-musl.zip" -o /tmp/bun.zip
            unzip /tmp/bun.zip -d /tmp/bun
            cp /tmp/bun/*/bun /usr/local/bin/bun
            PROC_SAFE_NATIVE=require pnpm test:bun
            pnpm benchmark:imports
            bun scripts/benchmark-imports.mjs
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.node == 24
        with:
          name: binding-${{ matrix.label }}
          path: native/*.node
          if-no-files-found: error
  freebsd:
    name: Native (freebsd-${{ matrix.cpu }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        cpu: [x64, arm64]
        include:
          - cpu: x64
            arch: x86_64
          - cpu: arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare dependencies and JavaScript on the Linux host
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Real FreeBSD 14.4 kernel (ARM64 CPU emulated by QEMU)
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: '14.4'
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: pkg install -y node${{ matrix.node }} npm-node${{ matrix.node }} rust gmake
          run: |
            set -eu
            node -e "if(process.platform !== 'freebsd' || process.arch !== '${{ matrix.cpu }}') throw new Error('wrong runtime')"
            node scripts/build-native.mjs
            PROC_SAFE_NATIVE=require node --test scripts/native-runtime.test.mjs
            node scripts/check-release-packages.mjs --allow-host-only --npm-only
            node scripts/check-restricted-visibility.mjs
            node scripts/benchmark-imports.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.node == 24
        with:
          name: binding-freebsd-${{ matrix.cpu }}
          path: native/*.node
          if-no-files-found: error
