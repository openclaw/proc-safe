name: Native runtimes
on:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    name: Native (${{ matrix.label }}, Node ${{ matrix.node-major }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.22.1"]
        label: [linux-x64-gnu, linux-arm64-gnu, darwin-x64, darwin-arm64, win32-x64-msvc, win32-arm64-msvc]
        include:
          - node: "22.23.4"
            node-major: 22
          - node: "24.22.1"
            node-major: 24
          - label: linux-x64-gnu
            os: ubuntu-latest
            arch: x64
          - label: linux-arm64-gnu
            os: ubuntu-24.04-arm
            arch: arm64
          - label: darwin-x64
            # Native Intel command inspection is intentionally unsupported under Rosetta.
            os: macos-26-intel
            arch: x64
            macos-minimum: '10.12'
          - label: darwin-arm64
            os: xcode-27
            arch: arm64
            macos-minimum: '11.0'
          - label: win32-x64-msvc
            os: windows-latest
            arch: x64
          - label: win32-arm64-msvc
            os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}
      - name: Verify real runner architecture
        run: node -e "if(process.arch !== '${{ matrix.arch }}') throw new Error('wrong runner architecture')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Preserve native macOS deployment targets
        if: runner.os == 'macOS'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-minimum }}' >> "$GITHUB_ENV"
      - run: pnpm native:build
      - name: Verify native macOS minimum
        if: runner.os == 'macOS'
        run: |
          minimum=$(otool -l native/proc-safe-native.darwin-${{ matrix.arch }}.node | awk '/LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX/ { found = 1; next } found && ($1 == "minos" || $1 == "version") { print $2; exit }')
          test "$minimum" = '${{ matrix.macos-minimum }}'
      - name: Darwin-only Rust unit tests
        if: runner.os == 'macOS' && matrix.node == '24.22.1'
        run: cargo test --workspace --locked
      - name: Prepare real systemd user-manager proof
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev
          sh scripts/setup-systemd-proof.sh
      - name: Build real 32-bit Windows child
        if: runner.os == 'Windows'
        run: |
          rustup target add i686-pc-windows-msvc
          rustc --target i686-pc-windows-msvc test/fixtures/inspect-child.rs -o target/inspect-child-x86.exe
      - name: Native Node contracts and main/Worker proof
        env:
          PROC_SAFE_NATIVE: require
        # Process-heavy Windows fixtures share runner CPU; retain every per-test deadline.
        run: pnpm test --fileParallelism=${{ runner.os != 'Windows' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Native Bun contracts and main/Worker proof
        env:
          PROC_SAFE_NATIVE: require
        run: pnpm test:bun --fileParallelism=${{ runner.os != 'Windows' }}
      - name: Real systemd cross-user machine bridge on Node and Bun
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/systemd-machine-proof.mjs "$(id -un)" "$(id -u)"
          sudo "$(command -v bun)" scripts/systemd-machine-proof.mjs "$(id -un)" "$(id -u)"
      - name: Stop systemd proof unit
        if: always() && runner.os == 'Linux'
        run: |
          if [ -n "${PROC_SAFE_SYSTEMD_UNIT:-}" ]; then
            systemctl --user stop "$PROC_SAFE_SYSTEMD_UNIT"
          fi
      - name: Real Rosetta census and command refusal on main and Worker
        if: matrix.label == 'darwin-arm64'
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true
          node_version="$(node --version)"
          curl --fail --location "https://nodejs.org/dist/${node_version}/node-${node_version}-darwin-x64.tar.gz" -o "$RUNNER_TEMP/node-x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/node-x64.tar.gz" -C "$RUNNER_TEMP"
          rustup target add x86_64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET=10.12 node scripts/build-native.mjs x86_64-apple-darwin
          arch -x86_64 "$RUNNER_TEMP/node-${node_version}-darwin-x64/bin/node" scripts/inspect-proof.mjs --rosetta
          arch -x86_64 "$RUNNER_TEMP/node-${node_version}-darwin-x64/bin/node" scripts/check-darwin-seatbelt.mjs
          curl --fail --location "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-darwin-x64.zip" -o "$RUNNER_TEMP/bun-x64.zip"
          unzip -q "$RUNNER_TEMP/bun-x64.zip" -d "$RUNNER_TEMP/bun-x64"
          arch -x86_64 "$RUNNER_TEMP/bun-x64/bun-darwin-x64/bun" scripts/check-darwin-seatbelt.mjs
          # The Intel runtime lane owns the published x64 artifact.
          rm native/proc-safe-native.darwin-x64.node
      - name: Real Windows permission denial
        if: runner.os == 'Windows'
        run: node scripts/check-windows-denial.mjs
      - name: Real Darwin permission denial
        if: runner.os == 'macOS'
        run: node scripts/check-darwin-denial.mjs
      - name: Real restricted procfs namespace
        if: runner.os == 'Linux'
        run: node scripts/check-restricted-visibility.mjs
      - name: Real foreign-file residency denial
        if: runner.os == 'Linux'
        run: node scripts/check-residency-denial.mjs
      - run: pnpm package:smoke
      - name: Installed default-call smoke on Node and Bun
        shell: bash
        run: node scripts/installed-smoke.mjs "$(node -p 'require("./package.json").version')" --bun --tarballs release-artifacts/*.tgz
      - name: Separate Windows fault-injection addon (Node)
        if: runner.os == 'Windows'
        run: node scripts/check-windows-job-fault.mjs
      - name: Separate Windows fault-injection addon (Bun)
        if: runner.os == 'Windows'
        run: bun scripts/check-windows-job-fault.mjs --test-only
      - run: pnpm benchmark:imports
      - run: bun scripts/benchmark-imports.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.node == '24.22.1'
        with:
          name: binding-${{ matrix.label }}
          path: native/*.node
          if-no-files-found: error
  musl:
    name: Native (${{ matrix.label }}, Node ${{ matrix.node-major }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.22.1"]
        label: [linux-x64-musl, linux-arm64-musl]
        include:
          - node: "22.23.4"
            node-major: 22
          - node: "24.22.1"
            node-major: 24
          - label: linux-x64-musl
            os: ubuntu-latest
            arch: x64
          - label: linux-arm64-musl
            os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and execute on musl
        env:
          NODE_VERSION: ${{ matrix.node }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -e EXPECTED_ARCH -v "$PWD:/work" -w /work "node:${NODE_VERSION}-alpine" sh -euxc '
            apk add --no-cache --upgrade ca-certificates-bundle=20261020-r0
            apk add --no-cache build-base curl unzip bash git
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
            npm install --global pnpm@12.15.0
            node -e "if(process.arch !== process.env.EXPECTED_ARCH) throw new Error(\"wrong runner\")"
            pnpm install --frozen-lockfile
            pnpm build
            pnpm native:build
            export PROC_SAFE_SYSTEMD_NO_LIBRARY=1
            PROC_SAFE_NATIVE=require pnpm test
            node scripts/check-residency-denial.mjs
            pnpm package:smoke
            bun_arch="$EXPECTED_ARCH"
            if [ "$bun_arch" = arm64 ]; then bun_arch=aarch64; fi
            curl -fL "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-${bun_arch}-musl.zip" -o /tmp/bun.zip
            unzip /tmp/bun.zip -d /tmp/bun
            cp /tmp/bun/*/bun /usr/local/bin/bun
            node scripts/installed-smoke.mjs "$(node -p '\''require("./package.json").version'\'')" --bun --tarballs release-artifacts/*.tgz
            PROC_SAFE_NATIVE=require pnpm test:bun
            pnpm benchmark:imports
            bun scripts/benchmark-imports.mjs
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.node == '24.22.1'
        with:
          name: binding-${{ matrix.label }}
          path: native/*.node
          if-no-files-found: error
  freebsd:
    name: Native (freebsd-${{ matrix.cpu }}, Node ${{ matrix.node-major }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.22.1"]
        cpu: [x64, arm64]
        include:
          - node: "22.23.4"
            node-major: 22
          - node: "24.22.1"
            node-major: 24
          - cpu: x64
            arch: x86_64
          - cpu: arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare dependencies and JavaScript on the Linux host
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Real FreeBSD 14.4 kernel (ARM64 CPU emulated by QEMU)
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: '14.4'
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: pkg install -y node${{ matrix.node-major }} npm-node${{ matrix.node-major }} rust gmake
          run: |
            set -eu
            node -e "if(process.platform !== 'freebsd' || process.arch !== '${{ matrix.cpu }}') throw new Error('wrong runtime')"
            node scripts/build-native.mjs
            PROC_SAFE_NATIVE=require node --test scripts/native-runtime.test.mjs
            node scripts/check-release-packages.mjs --allow-host-only --npm-only
            node scripts/installed-smoke.mjs "$(node -p 'require("./package.json").version')" --tarballs release-artifacts/*.tgz
            node scripts/check-restricted-visibility.mjs
            node scripts/benchmark-imports.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.node == '24.22.1'
        with:
          name: binding-freebsd-${{ matrix.cpu }}
          path: native/*.node
          if-no-files-found: error
