[package]
name = "proc-safe-native"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/openclaw/proc-safe"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
fault-injection = []

[dependencies]
napi = { version = "3.14.2", default-features = false, features = ["dyn-symbols", "napi8"] }
napi-derive = "3.6.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_ProcessStatus", "Win32_Globalization", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[build-dependencies]
cc = "1.7.0"
napi-build = "2.6.0"

[[bin]]
name = "proc-safe-retained-fixture"
path = "../test/fixtures/windows-retained-exit.rs"

[[bin]]
name = "proc-safe-restricted-fixture"
path = "../test/fixtures/windows-restricted-probe.rs"

[[bin]]
name = "proc-safe-inspect-fixture"
path = "../test/fixtures/inspect-child.rs"

[[bin]]
name = "proc-safe-job-fixture"
path = "../test/fixtures/windows-job.rs"
